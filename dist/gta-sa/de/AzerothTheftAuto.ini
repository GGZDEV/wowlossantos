; Azeroth Theft Auto - GTA SA adapter configuration.
; Copy next to AzerothTheftAuto.asi (the ASI loader's plugin directory).
; The bridge token is NOT stored here: set ATA_BRIDGE_TOKEN in the environment
; that launches gta_sa.exe, or put it alone on the first line of TokenFile
; (a local file that must never be committed or shared).

Port = 17635
TokenFile = AzerothTheftAuto.token
FixtureId = m1-arena
; Stock ped model used as the target placeholder (7 = a stock civilian ped id in SA).
TargetModel = 7
; Virtual-key codes (hex). Defaults: F9 toggle test mode, F8 reset fixture, '1' cast.
KeyToggle = 0x78
KeyReset = 0x77
KeyCast = 0x31
